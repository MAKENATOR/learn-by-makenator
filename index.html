<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn with MaKeNaToER</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body, html {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  height: 100%;
  overflow: hidden;
  background: #0a0a0a;
}

/* Particle Background */
#particles {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Animated Gradient Background */
.animated-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, #0a0a0a, #1a1a2e, #16213e, #0a0a0a);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  z-index: 0;
}

@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* Top Bar with glow effect */
#topBar {
  width: 100%;
  padding: 20px 0;
  background: rgba(17, 17, 17, 0.9);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  color: #fff;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
  position: fixed;
  top: 0;
  left: 0;
  z-index: 100;
  border-bottom: 2px solid rgba(0, 255, 255, 0.5);
  letter-spacing: 3px;
  text-transform: uppercase;
  animation: titleGlow 3s ease-in-out infinite;
}

@keyframes titleGlow {
  0%, 100% { text-shadow: 0 0 10px rgba(0, 255, 255, 0.5), 0 0 20px rgba(0, 255, 255, 0.3); }
  50% { text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.5); }
}

/* Landing Page */
#landing {
  display: flex;
  width: 100%;
  height: 100vh;
  position: relative;
  padding-top: 80px;
  z-index: 1;
}

.half {
  flex: 1;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 48px;
  font-weight: bold;
  color: white;
  cursor: pointer;
  position: relative;
  transition: flex 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
  overflow: hidden;
}

.half::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.4);
  transition: background 0.5s;
  z-index: 1;
}

.half:hover::before {
  background: rgba(0, 0, 0, 0.2);
}

.half span {
  position: relative;
  z-index: 2;
  animation: float 3s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(-10px); }
}

#chemHalf {
  background: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQqFfXtMDuxDXidZvWj_xI9blD2MRfFz7ik-w&s') center/cover no-repeat;
}

#physHalf {
  background: url('https://s3.envato.com/files/53980389/preview.jpg') center/cover no-repeat;
}

/* Animated overlay on hover */
.half::after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  background: radial-gradient(circle, rgba(0, 255, 255, 0.3), transparent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
  z-index: 1;
}

.half:hover::after {
  width: 500px;
  height: 500px;
}

/* Midline with glow */
#midline {
  position: absolute;
  left: 50%;
  top: 0;
  width: 4px;
  height: 100%;
  background: linear-gradient(to bottom, 
    rgba(0, 255, 255, 0.8), 
    rgba(0, 200, 255, 0.8), 
    rgba(0, 255, 255, 0.8));
  transition: left 1s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 40px rgba(0, 255, 255, 0.5);
  animation: pulse 2s ease-in-out infinite;
  z-index: 10;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scaleX(1); }
  50% { opacity: 0.7; transform: scaleX(1.5); }
}

/* Physics Section */
#physics {
  display: none;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  padding-top: 100px;
  width: 100%;
  height: 100vh;
  background: transparent;
  color: white;
  overflow-y: auto;
  position: relative;
  z-index: 1;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

#physics h2 {
  font-size: 42px;
  margin-bottom: 30px;
  background: linear-gradient(45deg, #00d4ff, #00ffff, #00d4ff);
  background-size: 200% 200%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  animation: gradientText 3s ease infinite;
  text-transform: uppercase;
  letter-spacing: 2px;
}

@keyframes gradientText {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

.topic-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 25px;
  width: 90%;
  max-width: 1200px;
  padding-bottom: 50px;
}

/* Advanced topic buttons with 3D effect */
.topic-btn {
  position: relative;
  overflow: hidden;
  padding: 30px 20px;
  font-size: 19px;
  font-weight: 600;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 2px solid rgba(0, 255, 255, 0.3);
  text-align: center;
  cursor: pointer;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  opacity: 0;
  transform: translateY(50px) rotateX(20deg);
  transform-style: preserve-3d;
  perspective: 1000px;
}

.topic-btn.visible {
  opacity: 1;
  transform: translateY(0) rotateX(0deg);
}

.topic-btn:hover {
  transform: translateY(-10px) scale(1.05);
  background: rgba(0, 255, 255, 0.15);
  border-color: rgba(0, 255, 255, 0.8);
  box-shadow: 
    0 10px 40px rgba(0, 255, 255, 0.4),
    0 0 60px rgba(0, 255, 255, 0.3),
    inset 0 0 20px rgba(0, 255, 255, 0.1);
}

/* Shimmer effect */
.topic-btn::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background: linear-gradient(
    45deg,
    transparent,
    rgba(255, 255, 255, 0.1),
    transparent
  );
  transform: rotate(45deg);
  animation: shimmer 3s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
  100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
}

/* Ripple effect */
.topic-btn::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  top: 50%;
  left: 50%;
  background: radial-gradient(circle, rgba(0, 255, 255, 0.6), transparent);
  border-radius: 50%;
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.6s, opacity 0.6s;
}

.topic-btn:active::after {
  transform: translate(-50%, -50%) scale(2.5);
  opacity: 1;
  transition: 0s;
}

/* Back button with modern design */
.back-btn {
  padding: 15px 35px;
  margin-bottom: 30px;
  font-size: 18px;
  font-weight: 600;
  border-radius: 50px;
  background: linear-gradient(135deg, #00d4ff, #00ffff);
  border: none;
  cursor: pointer;
  color: #000;
  box-shadow: 0 5px 25px rgba(0, 255, 255, 0.4);
  transition: all 0.3s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
  position: relative;
  overflow: hidden;
}

.back-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.3);
  transition: left 0.5s;
}

.back-btn:hover::before {
  left: 100%;
}

.back-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 35px rgba(0, 255, 255, 0.6);
}

.back-btn:active {
  transform: translateY(0);
}

/* Scrollbar styling */
#physics::-webkit-scrollbar {
  width: 10px;
}

#physics::-webkit-scrollbar-track {
  background: rgba(255, 255, 255, 0.05);
}

#physics::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, #00d4ff, #00ffff);
  border-radius: 10px;
}

#physics::-webkit-scrollbar-thumb:hover {
  background: linear-gradient(180deg, #00ffff, #00d4ff);
}

/* Loading animation */
@keyframes rotate {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

/* Responsive design */
@media (max-width: 768px) {
  .half {
    font-size: 32px;
  }
  
  #physics h2 {
    font-size: 32px;
  }
  
  .topic-grid {
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 15px;
  }
  
  .topic-btn {
    padding: 20px 15px;
    font-size: 16px;
  }
}
</style>
</head>
<body>

<!-- Animated Background -->
<div class="animated-bg"></div>

<!-- Particle Canvas -->
<canvas id="particles"></canvas>

<!-- Top Bar -->
<div id="topBar">Learn with MaKeNaToER</div>

<!-- Landing -->
<div id="landing">
  <div class="half" id="chemHalf" onclick="showComingSoon('chem')">
    <span>Chemistry</span>
  </div>
  <div class="half" id="physHalf" onclick="selectPhysics()">
    <span>Physics</span>
  </div>
  <div id="midline"></div>
</div>

<!-- Physics -->
<div id="physics">
  <button class="back-btn" onclick="backToLanding()">← Back to Landing</button>
  <h2 id="physicsHeader">Physics Topics</h2>
  <div class="topic-grid" id="physicsTopics"></div>
</div>

<script>
// Particle Animation
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

class Particle {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = Math.random() * 0.5 - 0.25;
    this.speedY = Math.random() * 0.5 - 0.25;
    this.opacity = Math.random() * 0.5 + 0.2;
  }

  update() {
    this.x += this.speedX;
    this.y += this.speedY;

    if (this.x > canvas.width) this.x = 0;
    if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0;
    if (this.y < 0) this.y = canvas.height;
  }

  draw() {
    ctx.fillStyle = `rgba(0, 255, 255, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

const particles = [];
for (let i = 0; i < 100; i++) {
  particles.push(new Particle());
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  particles.forEach(particle => {
    particle.update();
    particle.draw();
  });

  // Connect nearby particles
  particles.forEach((p1, i) => {
    particles.slice(i + 1).forEach(p2 => {
      const dx = p1.x - p2.x;
      const dy = p1.y - p2.y;
      const distance = Math.sqrt(dx * dx + dy * dy);

      if (distance < 100) {
        ctx.strokeStyle = `rgba(0, 255, 255, ${0.2 * (1 - distance / 100)})`;
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    });
  });

  requestAnimationFrame(animateParticles);
}

animateParticles();

window.addEventListener('resize', () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

// Physics Data
const physicsData = {
  "Mechanics": ["Kinematics","Laws of Motion","Work, Energy & Power","Gravitation","Oscillations","Fluid Mechanics"],
  "Thermodynamics": [
    "Thermal Properties & Temperature",
    "Kinetic Theory of Gases",
    "Calorimetry & Heat",
    "First Law of Thermodynamics",
    "Thermodynamic Processes",
    "Second Law of Thermodynamics"
  ], 
  "Waves": [], 
  "Optics": [], 
  "Electricity & Magnetism": [],
  "Modern Physics": [], 
  "Nuclear Physics": [], 
  "Particle Physics": []
};

const mechanicsLinks = {
  "Kinematics": "https://www.youtube.com/watch?v=FNOp51TgLEQ",
  "Laws of Motion": "https://www.youtube.com/watch?v=UNX2_i1nrnI",
  "Work, Energy & Power": "https://www.youtube.com/watch?v=_i487tNP758",
  "Gravitation": "https://www.youtube.com/watch?v=IoGuqRDJrSY",
  "Oscillations": "https://www.youtube.com/watch?v=qeXCrxLMzjA",
  "Fluid Mechanics": "https://www.youtube.com/watch?v=0gmhlElpyf0"
};

const thermodynamicsLinks = {
  "Thermal Properties & Temperature": "https://www.youtube.com/watch?v=Hbd-IjXO9nM",
  "Kinetic Theory of Gases": "https://www.youtube.com/watch?v=T_iDLE4pCG0",
  "Calorimetry & Heat": "https://www.youtube.com/watch?v=JgmhyhCDIWg",
  "First Law of Thermodynamics": "https://www.youtube.com/watch?v=NyOYW07-L5g",
  "Thermodynamic Processes": "http://www.youtube.com/watch?v=AzmXVvxXN70",
  "Second Law of Thermodynamics": "https://www.youtube.com/watch?v=DWiCaDPM7Hk"
};

function showComingSoon(subject){
  const message = subject === 'chem' ? 'Chemistry Section Coming Soon! ⚗️' : 'Topic Coming Soon! ⚡';
  
  // Create custom notification
  const notification = document.createElement('div');
  notification.style.cssText = `
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: rgba(0, 255, 255, 0.9);
    color: #000;
    padding: 30px 50px;
    border-radius: 20px;
    font-size: 24px;
    font-weight: bold;
    z-index: 1000;
    box-shadow: 0 0 50px rgba(0, 255, 255, 0.8);
    transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  `;
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => notification.style.transform = 'translate(-50%, -50%) scale(1)', 10);
  setTimeout(() => {
    notification.style.transform = 'translate(-50%, -50%) scale(0)';
    setTimeout(() => document.body.removeChild(notification), 300);
  }, 2000);
}

function selectPhysics(){
  document.getElementById('midline').style.left = '75%';
  document.getElementById('chemHalf').style.flex = '0.5';
  document.getElementById('physHalf').style.flex = '1.5';
  
  setTimeout(() => {
    document.getElementById('landing').style.display = 'none';
    document.getElementById('physics').style.display = 'flex';
    showMainTopics();
  }, 1000);
}

function backToLanding(){
  document.getElementById('physics').style.display = 'none';
  document.getElementById('landing').style.display = 'flex';
  document.getElementById('midline').style.left = '50%';
  document.getElementById('chemHalf').style.flex = '1';
  document.getElementById('physHalf').style.flex = '1';
  document.getElementById('physicsTopics').innerHTML = '';
  document.getElementById('physicsHeader').innerText = 'Physics Topics';
}

function showMainTopics(){
  const container = document.getElementById('physicsTopics');
  container.innerHTML = '';
  document.getElementById('physicsHeader').innerText = 'Physics Topics';
  
  Object.keys(physicsData).forEach((topic, i) => {
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    btn.innerText = topic;
    btn.onclick = () => {
      if(physicsData[topic].length > 0) showSubTopics(topic);
      else showComingSoon();
    };
    container.appendChild(btn);
    setTimeout(() => btn.classList.add('visible'), i * 80);
  });
}

function showSubTopics(mainTopic){
  const container = document.getElementById('physicsTopics');
  container.innerHTML = '';
  document.getElementById('physicsHeader').innerText = mainTopic + " Subtopics";

  physicsData[mainTopic].forEach((sub, i) => {
    const btn = document.createElement('div');
    btn.className = 'topic-btn';
    btn.innerText = sub;
    btn.onclick = () => {
      if(mainTopic === "Mechanics" && mechanicsLinks[sub]){
        window.open(mechanicsLinks[sub], "_blank");
      } else if(mainTopic === "Thermodynamics" && thermodynamicsLinks[sub]){
        window.open(thermodynamicsLinks[sub], "_blank");
      } else {
        showComingSoon();
      }
    };
    container.appendChild(btn);
    setTimeout(() => btn.classList.add('visible'), i * 80);
  });
}

// Add mouse parallax effect to landing halves
document.addEventListener('mousemove', (e) => {
  if(document.getElementById('landing').style.display !== 'none') {
    const mouseX = e.clientX / window.innerWidth - 0.5;
    const mouseY = e.clientY / window.innerHeight - 0.5;
    
    document.querySelectorAll('.half').forEach(half => {
      const depth = 20;
      const moveX = mouseX * depth;
      const moveY = mouseY * depth;
      half.style.transform = `translate(${moveX}px, ${moveY}px)`;
    });
  }
});
</script>

</body>
</html>
